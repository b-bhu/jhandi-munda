[package]
name = "jhandi_munda"
version = "0.1.0"
description = "Jhandi Munda Casino onchain program (MagicBlock Solana Blitz v10)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jhandi_munda"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# init-if-needed: the faucet's per-wallet cooldown record (D33) is created on
# the wallet's first claim via init_if_needed. Version stays pinned.
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
